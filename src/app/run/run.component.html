<!-- Run Mode Root Template -->
<div class="run-container">

  <!-- ── Sticky Nav (persistent across all views when a run is active) ────────── -->
  <div class="run-nav" *ngIf="runState">
    <button class="run-nav-back" (click)="exitRun()">
      <app-icon name="chevron-left" [size]="16"></app-icon>
      Exit
    </button>
    <span class="run-nav-title">Act {{ runState.actIndex + 1 }}</span>
    <div class="run-nav-stats">
      <span class="run-lives">♥ {{ runState.lives }}</span>
      <span class="run-gold"><app-icon name="coin" [size]="12"></app-icon>{{ runState.gold }}g</span>
    </div>
  </div>


  <!-- ── Content slot ────────────────────────────────────────────────────────────── -->
  <div class="run-content">

  <!-- ── Node Map ────────────────────────────────────────── -->
  <div class="run-map-layout" *ngIf="viewMode === 'map' && nodeMap">
    <div class="run-map">
      <h2 class="run-map-title">Choose Your Path</h2>
      <app-node-map
        [nodeMap]="nodeMap"
        [currentNodeId]="runState?.currentNodeId ?? null"
        [completedNodeIds]="runState?.completedNodeIds ?? []"
        [availableNodes]="availableNodes"
        (nodeSelected)="selectNode($event)"
      ></app-node-map>
    </div>

    <aside class="run-sidebar" *ngIf="runState">
      <div class="sidebar-stat"><span class="sidebar-label">HP</span><span class="run-lives">{{ runState.lives }}/{{ runState.maxLives }}</span></div>
      <div class="sidebar-stat"><span class="sidebar-label">Gold</span><span class="run-gold"><app-icon name="coin" [size]="12"></app-icon>{{ runState.gold }}g</span></div>
      <div class="sidebar-relics" *ngIf="activeRelics.length > 0">
        <app-relic-inventory [relics]="activeRelics"></app-relic-inventory>
      </div>
    </aside>
  </div>

  <!-- ── Reward Screen ───────────────────────────────────── -->
  <app-reward-screen
    *ngIf="viewMode === 'reward' && rewardConfig"
    [config]="rewardConfig"
    (rewardCollected)="collectReward($event)"
    (screenClosed)="closeRewardScreen()"
  ></app-reward-screen>

  <!-- ── Rest Screen ─────────────────────────────────────── -->
  <app-rest-screen
    *ngIf="viewMode === 'rest' && runState"
    [currentLives]="runState.lives"
    [maxLives]="runState.maxLives"
    [healAmount]="getHealAmount()"
    [deckCards]="getDeckCards()"
    (restChosen)="restHeal()"
    (skipChosen)="viewMode = 'map'"
    (cardUpgraded)="onCardUpgraded($event)"
    (upgradeConfirmed)="onUpgradeConfirmed()"
  ></app-rest-screen>

  <!-- ── Shop Screen ─────────────────────────────────────── -->
  <app-shop-screen
    *ngIf="viewMode === 'shop' && runState"
    [shopItems]="shopItems"
    [currentGold]="runState.gold"
    [currentLives]="runState.lives"
    [maxLives]="runState.maxLives"
    [cardRemoveCost]="cardRemoveCost"
    [cardUpgradeCost]="cardUpgradeCost"
    [deckCards]="shopDeckSnapshot"
    (itemBought)="onShopBuy($event)"
    (shopLeft)="leaveShop()"
    (cardRemoved)="onShopCardRemoved($event)"
    (cardUpgraded)="onShopCardUpgraded($event)"
  ></app-shop-screen>

  <!-- ── Event Screen ────────────────────────────────────── -->
  <app-event-screen
    *ngIf="viewMode === 'event' && currentEvent"
    [event]="currentEvent"
    [resolvedGamble]="eventGambleResult"
    [removedCardName]="eventRemovedCardName"
    (previewGamble)="onPreviewGamble($event)"
    (previewCardRemoval)="onPreviewCardRemoval($event)"
    (choiceMade)="completeEvent($event)"
  ></app-event-screen>

  <!-- ── Act Transition ────────────────────────────────────── -->
  <app-act-transition
    *ngIf="viewMode === 'act-transition' && runState"
    [completedAct]="runState.actIndex"
    [bossName]="actTransitionBossName"
    [relicCount]="runState.relicIds.length"
    [encounterCount]="runState.encounterResults.length"
    (continued)="onActTransitionContinued()"
  ></app-act-transition>

  <!-- ── Victory Epilogue ──────────────────────────────────── -->
  <!--
    Shown on VICTORY between the final-boss defeat and the run summary.
    Cold-load / already-passed safety: if RunStatus is VICTORY on init,
    ngOnInit routes to 'map' (hasActiveRun path) — the run is already
    cleaned up by advanceAct(). That naturally falls through to summary
    without stranding the player in the epilogue.
  -->
  <app-run-epilogue
    *ngIf="viewMode === 'epilogue'"
    [unlockedAscensionLevel]="epilogueUnlockedAscension"
    [bossPresetId]="finalBossPresetId"
    (continued)="onEpilogueContinued()"
  ></app-run-epilogue>

  <!-- ── Run Summary ─────────────────────────────────────── -->
  <app-run-summary
    *ngIf="viewMode === 'summary' && runState"
    [runState]="runState"
    (returnToMenu)="returnToMenu()"
    (startNewRun)="startNewRun($event)"
    (launchEndless)="launchEndless()"
  ></app-run-summary>

  </div><!-- /run-content -->

</div>
