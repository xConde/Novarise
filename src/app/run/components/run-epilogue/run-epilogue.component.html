<div class="run-epilogue" role="main" aria-label="Victory epilogue">

  <!-- ── Stage A: Title moment ─────────────────────────────────────────────── -->
  <div class="run-epilogue__title-block" [class.run-epilogue__title-block--visible]="titleVisible" aria-live="assertive">
    <p class="run-epilogue__eyebrow">NOVA SOVEREIGN DEFEATED</p>
    <h1 class="run-epilogue__title">THE SPIRE STANDS</h1>
  </div>

  <!-- ── Stage B: Epilogue copy ────────────────────────────────────────────── -->
  <!-- Copy variant is driven by bossPresetId via epilogueCopy (EpilogueCopy). -->
  <!-- Default (bossPresetId='') renders identical text to the original.      -->
  <div class="run-epilogue__copy" [class.run-epilogue__copy--visible]="copyVisible">
    <p class="run-epilogue__line">{{ epilogueCopy.line1 }}</p>
    <p class="run-epilogue__line">{{ epilogueCopy.line2 }}</p>
    <p class="run-epilogue__line run-epilogue__line--debrief">{{ epilogueCopy.attribution }}</p>
  </div>

  <!-- ── Stage C: Ascension unlock (conditional) ───────────────────────────── -->
  <div
    class="run-epilogue__ascension"
    *ngIf="showAscensionLine"
    [class.run-epilogue__ascension--visible]="ascensionVisible"
    aria-live="polite"
  >
    <span class="run-epilogue__ascension-icon">▲</span>
    <span class="run-epilogue__ascension-text">
      Ascension {{ unlockedAscensionLevel }} unlocked
    </span>
  </div>

  <!-- ── Stage D: Continue button ──────────────────────────────────────────── -->
  <div class="run-epilogue__actions" [class.run-epilogue__actions--visible]="buttonVisible">
    <button
      class="run-epilogue__btn"
      (click)="onContinue()"
      [disabled]="!buttonVisible"
      aria-label="Continue to run summary"
    >
      Continue
    </button>
  </div>

</div>
