<section class="card-draft" aria-label="Choose a card reward">

  <h3 class="card-draft__title">Choose a Card</h3>
  <p class="card-draft__hint">Select one card to add to your deck, or skip.</p>

  <div class="card-draft__list" role="list">
    <button
      *ngFor="let item of resolvedCards; let i = index; trackBy: trackByCardId"
      class="card-draft__card"
      [class]="'card-draft__card ' + getTypeClass(item.definition.type) + ' ' + getRarityClass(item.definition.rarity) + ' ' + getFrameClass(item.definition.type)"
      [class.card-draft__card--selected]="selectedCard === item.reward.cardId"
      (click)="pickCard(item.reward)"
      (pointerenter)="onCardPointerEnter($event, item)"
      (pointerleave)="onCardPointerLeave($event)"
      (pointerdown)="onCardPointerDown($event, item)"
      (pointermove)="onCardPointerMove($event)"
      (pointerup)="onCardPointerUp()"
      (pointercancel)="onCardPointerUp()"
      (focus)="onCardFocus($event, item)"
      (blur)="onCardBlur()"
      [attr.aria-label]="cardAriaLabel(item, i)"
      [attr.aria-describedby]="hoveredCard?.reward?.cardId === item.reward.cardId ? hoverTooltipId : null"
      [attr.aria-pressed]="selectedCard === item.reward.cardId"
      [attr.aria-keyshortcuts]="(i + 1).toString()"
      role="listitem"
      type="button"
    >
      <!-- Hotkey badge -->
      <span class="card-draft__hotkey" aria-hidden="true">{{ i + 1 }}</span>

      <!-- Energy cost bubble -->
      <span class="card-draft__cost" aria-hidden="true">{{ item.definition.energyCost }}</span>

      <!-- Type badge -->
      <span class="card-draft__type-badge">{{ item.definition.type }}</span>

      <!-- Card name -->
      <span class="card-draft__name">{{ item.definition.name }}</span>

      <!-- Effect glyph — hero art for non-tower cards. Sits in flow between
           the name and description so it occupies its own art-zone row without
           overlapping the description text. -->
      <span *ngIf="item.definition.type !== CardType.TOWER && getPrimaryGlyph(item.definition) as primaryGlyph"
            class="card-draft__art-glyph"
            [attr.data-card-type]="item.definition.type"
            aria-hidden="true">
        <app-icon [name]="primaryGlyph" [size]="48"></app-icon>
        <span *ngIf="getSecondaryGlyph(item.definition) as secondaryGlyph" class="card-draft__art-glyph-secondary">
          <app-icon [name]="secondaryGlyph" [size]="20"></app-icon>
        </span>
      </span>

      <!-- Description -->
      <span class="card-draft__description">
        <app-description-text [description]="item.definition.description"></app-description-text>
      </span>

      <!-- Rarity label -->
      <span class="card-draft__rarity">{{ item.definition.rarity }}</span>

      <!-- Footprint preview — tower cards only. Flat outlined square communicates
           "this card places a tower on a board tile." Purely decorative.
           Uses generic tower accent — card-draft does not bind per-subtype vars. -->
      <span *ngIf="item.definition.type === CardType.TOWER"
            class="card-draft__footprint"
            aria-hidden="true">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="4" y="4" width="16" height="16" rx="1"
                stroke="currentColor" stroke-width="1.5" fill="none"/>
        </svg>
      </span>

      <!-- Selected indicator -->
      <span class="card-draft__check" *ngIf="selectedCard === item.reward.cardId" aria-hidden="true">
        <app-icon name="check" [size]="14"></app-icon>
      </span>
    </button>
  </div>

  <button
    class="run-btn run-btn--secondary card-draft__skip-btn"
    type="button"
    (click)="skip()"
    [attr.aria-label]="skipGoldAmount > 0 ? 'Skip reward, gain ' + skipGoldAmount + ' gold. Press Escape to skip.' : 'Skip reward. Press Escape to skip.'"
    aria-keyshortcuts="Escape"
  >
    <ng-container *ngIf="skipGoldAmount > 0; else plainSkip">
      Skip <span class="card-draft__skip-gold" aria-hidden="true">(+{{ skipGoldAmount }}g)</span>
    </ng-container>
    <ng-template #plainSkip>Skip Card</ng-template>
    <span class="card-draft__skip-btn__hint" aria-hidden="true"> (Esc)</span>
  </button>

</section>

<div *ngIf="hoveredCard && hoveredCardRect"
     class="card-draft-tooltip"
     role="tooltip"
     [id]="hoverTooltipId"
     [style.top.px]="hoverTooltipTop"
     [style.left.px]="hoverTooltipLeft">
  <div class="card-draft-tooltip__header">
    <span class="card-draft-tooltip__name">{{ hoveredCard.definition.name }}</span>
    <span class="card-draft-tooltip__cost">{{ hoveredCard.definition.energyCost }}E</span>
  </div>
  <div class="card-draft-tooltip__meta">
    <span class="card-draft-tooltip__type">{{ hoveredCard.definition.type }}</span>
    <span class="card-draft-tooltip__rarity card-draft-tooltip__rarity--{{ hoveredCard.definition.rarity }}">
      {{ hoveredCard.definition.rarity }}
    </span>
  </div>
  <p class="card-draft-tooltip__description">
    <app-description-text [description]="hoverTooltipDescription(hoveredCard)"></app-description-text>
  </p>
  <div *ngIf="hoverTooltipKeywords(hoveredCard).length > 0" class="card-draft-tooltip__keywords">
    <span *ngFor="let kw of hoverTooltipKeywords(hoveredCard)" class="card-draft-tooltip__keyword">{{ kw }}</span>
  </div>
  <p *ngIf="hoveredCard.definition.flavorText"
     class="card-draft-tooltip__flavor"
     [attr.aria-label]="'Flavor: ' + hoveredCard.definition.flavorText">
    "{{ hoveredCard.definition.flavorText }}"
  </p>
</div>
