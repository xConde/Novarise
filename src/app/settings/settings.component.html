<div class="settings-container">
  <div class="settings-content">
    <header class="settings-header">
      <h1 class="settings-page-title">SETTINGS</h1>
    </header>

    <div class="settings-grid">
      <div class="setting-row">
        <span class="setting-label">Audio</span>
        <button
          class="setting-toggle"
          data-setting="audio"
          [class.active]="!audioMuted"
          (click)="toggleAudio()"
          [attr.aria-pressed]="!audioMuted"
        >{{ audioMuted ? 'Muted' : 'On' }}</button>
      </div>
      <div class="setting-row">
        <span class="setting-label">Music</span>
        <button
          class="setting-toggle"
          data-setting="music"
          [class.active]="musicEnabled"
          (click)="toggleMusic()"
          [attr.aria-pressed]="musicEnabled"
          aria-label="Toggle music"
        >{{ musicEnabled ? 'On' : 'Off' }}</button>
      </div>
      <div class="setting-row">
        <span class="setting-label">Music Volume</span>
        <input
          type="range"
          class="setting-slider"
          min="0"
          max="1"
          step="0.05"
          [value]="musicVolume"
          (input)="setMusicVolume(+$any($event.target).value)"
          [attr.aria-label]="'Music volume: ' + (musicVolume | percent)"
        />
      </div>
      <div class="setting-row">
        <span class="setting-label">Difficulty</span>
        <div class="setting-options" role="group" aria-label="Default difficulty">
          <button
            *ngFor="let d of difficulties"
            class="setting-option-btn"
            data-setting="difficulty"
            [class.active]="currentDifficulty === d"
            (click)="setDifficulty(d)"
            [attr.aria-pressed]="currentDifficulty === d"
          >{{ d | titlecase }}</button>
        </div>
      </div>
      <div class="setting-row">
        <span class="setting-label">Show FPS</span>
        <button
          class="setting-toggle"
          data-setting="fps"
          [class.active]="showFps"
          (click)="toggleFps()"
          [attr.aria-pressed]="showFps"
        >{{ showFps ? 'On' : 'Off' }}</button>
      </div>
      <div class="setting-row">
        <span class="setting-label">Reduce Motion</span>
        <button
          class="setting-toggle"
          data-setting="reduce-motion"
          [class.active]="reduceMotion"
          (click)="toggleReduceMotion()"
          [attr.aria-pressed]="reduceMotion"
        >{{ reduceMotion ? 'On' : 'Off' }}</button>
      </div>
      <div class="setting-row">
        <span class="setting-label">
          Colorblind Assist
          <span class="setting-hint">Enemy &amp; status colours — takes effect next encounter</span>
        </span>
        <button
          class="setting-toggle"
          data-setting="colorblind"
          [class.active]="colorblindAssist"
          (click)="toggleColorblindAssist()"
          [attr.aria-pressed]="colorblindAssist"
        >{{ colorblindAssist ? 'On' : 'Off' }}</button>
      </div>
      <div class="setting-row">
        <span class="setting-label">Text Size</span>
        <div class="setting-options" role="group" aria-label="Text size">
          <button
            *ngFor="let opt of fontScaleOptions"
            class="setting-option-btn"
            data-setting="font-scale"
            [class.active]="currentFontScale === opt.value"
            (click)="setFontScale(opt.value)"
            [attr.aria-pressed]="currentFontScale === opt.value"
          >{{ opt.label }}</button>
        </div>
      </div>
    </div>
  </div>
</div>
